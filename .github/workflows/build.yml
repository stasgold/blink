name: CI

on: [push]

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: use cache
      id: cache
      uses: actions/cache@v4
      with:
        path: |
          xcfs/.build
          Frameworks/ios_system/xcfs/.build
        key: ${{ runner.os }}-${{ hashFiles('get_frameworks.sh', 'xcfs/Package.swift') }}

    - name: get frameworks
      if: steps.cache.outputs.cache-hit != 'true'
      run: ./get_frameworks.sh

    - name: get resources
      if: steps.cache.outputs.cache-hit != 'true'
      run: ./get_resources.sh

    - name: copy xcconfig
      run: |
        cp template_setup.xcconfig developer_setup.xcconfig
        rm -rf Blink.xcodeproj/project.xcworkspace/xcshareddata/

    # Compile only: unsigned, nothing is uploaded anywhere.
    - name: build
      run: |
        set -o pipefail
        xcodebuild build -project Blink.xcodeproj -scheme Blink \
          -configuration Debug -destination 'generic/platform=iOS' \
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
          | tee build.log | grep -E 'error:|\*\* BUILD' || true
        grep -q '\*\* BUILD SUCCEEDED \*\*' build.log
